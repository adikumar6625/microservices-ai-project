version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: apppass
      POSTGRES_DB: authdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/auth-service/src/config/init.sql:/docker-entrypoint-initdb.d/init.sql

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:4001
      - PRODUCT_SERVICE_URL=http://product-service:4002
      - ORDER_SERVICE_URL=http://order-service:4003
      - AI_CHAT_SERVICE_URL=http://ai-chat-service:4004
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - auth-service

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - DATABASE_URL=postgresql://appuser:apppass@postgres:5432/authdb
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - postgres

  product-service:
    build: ./services/product-service
    restart: unless-stopped
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - MONGO_URL=mongodb://mongo:27017/products
    depends_on:
      - mongo

  order-service:
    build: ./services/order-service
    restart: unless-stopped
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - DATABASE_URL=postgresql://appuser:apppass@postgres:5432/authdb
    depends_on:
      - postgres

  ai-chat-service:
    build: ./services/ai-chat-service
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      - PORT=4004
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - PRODUCT_SERVICE_URL=http://product-service:4002
      - ORDER_SERVICE_URL=http://order-service:4003
    depends_on:
      - mongo

volumes:
  pgdata:
  mongodata:
